events {
    worker_connections 1024;
    # Step-by-step trace ONLY for your development/test machine IP
    debug_connection 127.0.0.1; 
    debug_connection 192.168.1.50; 
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Set the global log level to debug
    error_log /var/log/nginx/error_debug.log debug;
    
    # Optional: Log the exact upstream cookie data per-request
    log_format cookie_tracer '$remote_addr - $upstream_response_time '
                             'Upstream_Cookie: "$upstream_http_set_cookie" '
                             'Client_Cookie: "$http_cookie"';

    include /etc/nginx/conf.d/*.conf;
}
