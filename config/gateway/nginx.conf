upstream app_proxy {
    server proxy:80;
}

upstream oauth2_proxy {
    server oauth2-proxy:4180;
}

server {
    listen 80;

    # ---- oauth2-proxy endpoints (browser login flow) ----
    location /oauth2/ {
        proxy_pass http://oauth2_proxy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /oauth2/auth {
        internal;
        proxy_pass http://oauth2_proxy;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Forwarded-Uri $request_uri;
    }

    # ---- Dual auth for API paths (PAT *or* browser cookie) ----
    location = /internal/auth {
        internal;
        proxy_pass https://github.com;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_cache token_cache;
        proxy_cache_valid 200 15m;
    }

    # Macro-style: all federation API routes
    location ~ ^/(query|nodes|diagnoses|assessments|imaging-modalities|subjects|datasets|pipelines|docs|openapi\.json)(/|$) {
        auth_request /internal/auth;
        error_page 401 =401 @unauthorized;

        auth_request_set $user  $upstream_http_x_auth_request_user;
        auth_request_set $email $upstream_http_x_auth_request_email;

        proxy_set_header X-Forwarded-User  $user;
        proxy_set_header X-Forwarded-Email $email;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://app_proxy;
        proxy_read_timeout 300;
    }

    location @unauthorized {
        default_type application/json;
        return 401 '{"error":"unauthorized"}';
    }

    # ---- Query UI: cookie auth only (browser) ----
    location / {
        auth_request /oauth2/auth;
        error_page 401 = @oauth2_signin;

        auth_request_set $user  $upstream_http_x_auth_request_user;
        auth_request_set $email $upstream_http_x_auth_request_email;

        proxy_set_header X-Forwarded-User  $user;
        proxy_set_header X-Forwarded-Email $email;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://app_proxy;
    }

    location @oauth2_signin {
        return 302 /oauth2/start?rd=$request_uri;
    }
}