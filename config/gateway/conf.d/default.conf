map $http_host $public_port {
    default 80;
    ~^[^:]+:(?<p>[0-9]+)$ $p;
}

# If an Authorization: Bearer header is present, skip auth_request (backend will
# validate the token itself). Otherwise perform the internal auth_request to
# oauth2-proxy to obtain user identity headers for UI-originated requests.
map $http_authorization $skip_auth {
    default 0;
    ~^Bearer 1;
}

upstream app_proxy {
    server proxy:80;
}

upstream oauth2_proxy {
    server oauth2-proxy:4180;
}

upstream token_validator {
    server token_validator:4181;
}

server {
    listen 80;

    proxy_buffer_size       128k;
    proxy_buffers           4 256k;
    proxy_busy_buffers_size 256k;

    location /oauth2/ {
        proxy_pass http://oauth2_proxy;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $public_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Internal auth endpoint used with auth_request. It will proxy to oauth2-proxy
    # when no Bearer token is present; if a Bearer token is present we return 200
    # so auth_request succeeds but does not populate identity headers.
    location = /auth_internal {
        internal;
        # If a Bearer token was provided, jump to token validator via an
        # error_page trick so we can route to a different upstream.
        if ($skip_auth = 1) {
            return 418;
        }

        proxy_pass http://oauth2_proxy;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $public_port;
    }

    # If we returned 418 from /auth_internal (skip_auth), handle it here by
    # proxying to the token validator service which will validate the
    # Authorization header and return 200 with identity headers or 401.
    error_page 418 = @token_auth;
    location @token_auth {
        proxy_pass http://token_validator;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Capture the identity returned by the internal auth probe so we can forward
    # a safe header to backend services. Upstream headers from oauth2-proxy are
    # available as $upstream_http_x_auth_request_* variables.
    auth_request_set $auth_user $upstream_http_x_auth_request_user;

    location ~ ^/(query|nodes|diagnoses|assessments|imaging-modalities|subjects|datasets|pipelines|docs|openapi\.json)(/|$) {
        # Perform internal auth_request unless a Bearer token is present. If the
        # auth_request fails (no UI session) we return 401 for API clients.
        auth_request /auth_internal;
        error_page 401 = @api_unauthorized;

        proxy_pass http://app_proxy;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $public_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Forward Authorization through to backend so it can validate bearer tokens
        proxy_set_header Authorization $http_authorization;
        # Forward a gateway-signed identity header when auth_request populated it.
        proxy_set_header X-Auth-User $auth_user;
        proxy_read_timeout 300;
    }

    location / {
        auth_request /oauth2/auth;
        error_page 401 = @oauth2_signin;

        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie always;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $public_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://app_proxy;
        proxy_read_timeout 300;
    }

    location @oauth2_signin {
        return 302 http://$http_host/oauth2/sign_in?rd=$request_uri;
    }

    location @api_unauthorized {
        return 401;
    }
}
