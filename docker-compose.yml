# =============================================================================
# NeuroPoly DB — Root Compose
# Layers: root .env → recipes compose → root service overrides
# =============================================================================

include:
  - ./neurobagel-recipes/docker-compose.yml

services:
  # Override federation volumes: root-level mount for local_nb_nodes.json
  # (recipes compose tries to mount from recipes/ which doesn't have the file)
  federation:
    volumes: !override
      - ./local_nb_nodes.json:/usr/src/local_nb_nodes.json:ro
    ports: !override []

  # Seed datasets from workspace directory at devcontainer build time
  init_data:
    volumes: !override
      - ./seed-datasets:/input_data:ro
      - neurobagel_data:/data

  # Don't publish query_federation directly; the proxy serves it.
  query_federation:
    ports: !override []

  # Inject custom imaging vocab into the NeuroBagel API at startup.
  # !override replaces the upstream api.volumes list entirely to avoid
  # duplicate container mount paths.
  api:
    volumes: !override
      - "./scripts/neuropoly_api_entrypoint.sh:/usr/src/api_entrypoint.sh:ro"
      - "./scripts/inject_vocab_patch.py:/usr/src/neurobagel/inject_vocab_patch.py:ro"
      - "./config/neuropoly_imaging_modalities.json:/usr/src/neurobagel/neuropoly_imaging_modalities.json:ro"
      - "neurobagel_data:/data"
    ports: !override []

  # Prevent GraphDB from being published to the host; only gateway is public.
  graph:
    ports: !override []

  # Dev reverse proxy — single port for both query UI and federation API.
  # This stays internal; the auth gateway is the public entrypoint.
  proxy:
    build:
      context: ./config/nginx
    image: neuropoly-db-dev-proxy:local
    depends_on:
      - federation
      - query_federation

  # OAuth2 gateway — public entrypoint for the query UI and query API.
  # GitHub OAuth App credentials are provided via the root .env file.
  gateway:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
    ports:
      - "${NB_GATEWAY_PORT_HOST:-9010}:4180"
    environment:
      OAUTH2_PROXY_PROVIDER: github
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_UPSTREAMS: http://proxy:80
      OAUTH2_PROXY_REDIRECT_URL: http://localhost:${NB_GATEWAY_PORT_HOST:-9010}/oauth2/callback
      OAUTH2_PROXY_CLIENT_ID: ${NB_GATEWAY_CLIENT_ID:-}
      OAUTH2_PROXY_CLIENT_SECRET: ${NB_GATEWAY_CLIENT_SECRET:-}
      OAUTH2_PROXY_COOKIE_SECRET: ${NB_GATEWAY_COOKIE_SECRET:-}
      OAUTH2_PROXY_EMAIL_DOMAINS: ${NB_GATEWAY_EMAIL_DOMAINS:-*}
      OAUTH2_PROXY_GITHUB_ORG: ${NB_GATEWAY_GITHUB_ORG:-}
      OAUTH2_PROXY_GITHUB_TEAM: ${NB_GATEWAY_GITHUB_TEAM:-}
      OAUTH2_PROXY_GITHUB_USERS: ${NB_GATEWAY_GITHUB_USERS:-}
      OAUTH2_PROXY_COOKIE_SECURE: "false"
    depends_on:
      - proxy
