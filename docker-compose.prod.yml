# =============================================================================
# NeuroPoly DB — Fused Compose
# Generated by flattening the root compose file and included recipes compose.
# =============================================================================

name: neuropoly_nb_dev
networks:
  proxy-net:
    external: true
    name: neuropoly_nb_dev_default
secrets:
  db_admin_password:
    file: ./neurobagel-recipes/secrets/NB_GRAPH_ADMIN_PASSWORD.txt
    name: neuropoly_nb_dev_db_admin_password
  db_user_password:
    file: ./neurobagel-recipes/secrets/NB_GRAPH_PASSWORD.txt
    name: neuropoly_nb_dev_db_user_password
services:
  api:
    depends_on:
      init_data:
        condition: service_completed_successfully
        required: true
    entrypoint:
      - /usr/src/api_entrypoint.sh
    environment:
      NB_API_ALLOWED_ORIGINS: ${NB_NAPI_ALLOWED_ORIGINS:-"*"}
      NB_API_PORT: 8000
      NB_CONFIG: ${NB_CONFIG:-Neurobagel}
      NB_DATASETS_METADATA_PATH: /data/datasets_metadata.json
      NB_ENABLE_AUTH: ${NB_ENABLE_AUTH:-false}
      NB_GRAPH_ADDRESS: graph
      NB_GRAPH_DB: ${NB_GRAPH_DB:-repositories/my_db}
      NB_GRAPH_PORT: 7200
      NB_GRAPH_USERNAME: ${NB_GRAPH_USERNAME}
      NB_MIN_CELL_SIZE: ${NB_MIN_CELL_SIZE:-0}
      NB_NAPI_BASE_PATH: ${NB_NAPI_BASE_PATH}
      NB_QUERY_CLIENT_ID: ${NB_QUERY_CLIENT_ID}
      NB_RETURN_AGG: ${NB_RETURN_AGG:-true}
      VIRTUAL_HOST: ${NB_NAPI_DOMAIN}
      VIRTUAL_PATH: ${NB_NAPI_BASE_PATH:-/}
      VIRTUAL_PORT: 8000
      LETSENCRYPT_HOST: ${NB_NAPI_DOMAIN}
    image: neurobagel/api:${NB_NAPI_TAG:-latest}
    networks:
      default: null
    ports: []
    profiles:
      - "node"
    secrets:
      - source: db_user_password
        target: /run/secrets/db_user_password
    volumes:
      - bind:
          create_host_path: true
        read_only: true
        source: ./scripts/neuropoly_api_entrypoint.sh
        target: /usr/src/api_entrypoint.sh
        type: bind
      - bind:
          create_host_path: true
        read_only: true
        source: ./scripts/inject_vocab_patch.py
        target: /usr/src/neurobagel/inject_vocab_patch.py
        type: bind
      - bind:
          create_host_path: true
        read_only: true
        source: ./config/neuropoly_imaging_modalities.json
        target: /usr/src/neurobagel/neuropoly_imaging_modalities.json
        type: bind
      - source: neurobagel_data
        target: /data
        type: volume
        volume: {}
  federation:
    environment:
      NB_API_PORT: 8000
      NB_ENABLE_AUTH: ${NB_ENABLE_AUTH:-false}
      NB_FAPI_BASE_PATH: ${NB_FAPI_BASE_PATH}
      NB_FEDERATE_REMOTE_PUBLIC_NODES: ${NB_FEDERATE_REMOTE_PUBLIC_NODES:-True}
      NB_QUERY_CLIENT_ID: ${NB_QUERY_CLIENT_ID}
      VIRTUAL_HOST: ${NB_FAPI_DOMAIN}
      VIRTUAL_PATH: ${NB_FAPI_BASE_PATH:-/}
      VIRTUAL_PORT: 8000
      LETSENCRYPT_HOST: ${NB_FAPI_DOMAIN}
    image: neurobagel/federation_api:${NB_FAPI_TAG:-latest}
    networks:
      default: null
    ports: []
    profiles:
      - "portal"
    volumes:
      - bind:
          create_host_path: true
        read_only: true
        source: ./local_nb_nodes.json
        target: /usr/src/local_nb_nodes.json
        type: bind
  gateway:
    build:
      context: ./config/gateway
      dockerfile: Dockerfile
    depends_on:
      oauth2-proxy:
        condition: service_started
        required: true
      proxy:
        condition: service_started
        required: true
    image: neuropoly-db-dev-gateway:local
    networks:
      default: null
      proxy-net: null
    ports:
      - ${NB_GATEWAY_PORT_HOST:-9010}:443
    volumes:
      - type: bind
        source: ./config/gateway/tls
        target: /etc/nginx/tls
        bind:
          create_host_path: true
    profiles:
      - "portal"
  graph:
    depends_on:
      init_data:
        condition: service_completed_successfully
        required: true
    entrypoint:
      - /usr/src/neurobagel/scripts/setup.sh
    environment:
      NB_GRAPH_DB: ${NB_GRAPH_DB:-repositories/my_db}
      NB_GRAPH_MEMORY: ${NB_GRAPH_MEMORY:-2G}
      NB_GRAPH_PORT: 7200
      NB_GRAPH_USERNAME: ${NB_GRAPH_USERNAME}
    image: ontotext/graphdb:10.8.12
    networks:
      default: null
    ports: []
    profiles:
      - "node"
    secrets:
      - source: db_admin_password
        target: /run/secrets/db_admin_password
      - source: db_user_password
        target: /run/secrets/db_user_password
    volumes:
      - source: graphdb_home
        target: /opt/graphdb/home
        type: volume
        volume: {}
      - bind:
          create_host_path: true
        source: neurobagel-recipes/scripts
        target: /usr/src/neurobagel/scripts
        type: bind
      - bind:
          create_host_path: true
        source: neurobagel-recipes/vocab
        target: /usr/src/neurobagel/vocab
        type: bind
      - source: neurobagel_data
        target: /data
        type: volume
        volume: {}
    working_dir: /usr/src/neurobagel/scripts
  init_data:
    build:
      context: neurobagel-recipes/init_data
      dockerfile: Dockerfile
    command: |
      sh -euxc "rm -rf /data/* && python -m init_data.process_jsonld /input_data /data"
    networks:
      default: null
    profiles:
      - "node"
    volumes:
      - bind:
          create_host_path: true
        read_only: true
        source: ./seed-datasets
        target: /input_data
        type: bind
      - source: neurobagel_data
        target: /data
        type: volume
        volume: {}
  oauth2-proxy:
    depends_on:
      proxy:
        condition: service_started
        required: true
    environment:
      OAUTH2_PROXY_CLIENT_ID: ${NB_GATEWAY_CLIENT_ID:-}
      OAUTH2_PROXY_CLIENT_SECRET: ${NB_GATEWAY_CLIENT_SECRET:-}
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_COOKIE_SECRET: ${NB_GATEWAY_COOKIE_SECRET:-}
      OAUTH2_PROXY_EMAIL_DOMAINS: ${NB_GATEWAY_EMAIL_DOMAINS:-*}
      OAUTH2_PROXY_GITHUB_ORG: ${NB_GATEWAY_GITHUB_ORG:-}
      OAUTH2_PROXY_GITHUB_TEAM: ${NB_GATEWAY_GITHUB_TEAM:-}
      OAUTH2_PROXY_GITHUB_USERS: ${NB_GATEWAY_GITHUB_USERS:-}
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_PROVIDER: github
      OAUTH2_PROXY_REDIRECT_URL: ${NB_GATEWAY_REDIRECT_URL:-https://localhost:${NB_GATEWAY_PORT_HOST:-9010}/oauth2/callback}
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_SKIP_JWT_BEARER_TOKENS: "true"
      OAUTH2_PROXY_COOKIE_SECURE: ${NB_GATEWAY_COOKIE_SECURE:-true}
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
    networks:
      proxy-net: null
    profiles:
      - "portal"
  proxy:
    build:
      context: ./config/proxy
      dockerfile: Dockerfile
    depends_on:
      federation:
        condition: service_started
        required: true
      query_federation:
        condition: service_started
        required: true
    image: neuropoly-db-dev-proxy:local
    networks:
      proxy-net: null
    profiles:
      - "portal"
  query_federation:
    environment:
      NB_API_QUERY_URL: https://${NB_FAPI_DOMAIN}${NB_FAPI_BASE_PATH}
      NB_ENABLE_AUTH: ${NB_ENABLE_AUTH:-false}
      NB_QUERY_APP_BASE_PATH: ${NB_QUERY_APP_BASE_PATH:-/}
      NB_QUERY_CLIENT_ID: ${NB_QUERY_CLIENT_ID}
      NB_QUERY_HEADER_SCRIPT: ${NB_QUERY_HEADER_SCRIPT}
      VIRTUAL_HOST: ${NB_QUERY_DOMAIN}
      VIRTUAL_PATH: ${NB_QUERY_APP_BASE_PATH:-/}
      VIRTUAL_PORT: 5173
      LETSENCRYPT_HOST: ${NB_QUERY_DOMAIN}
    image: neurobagel/query_tool:${NB_QUERY_TAG:-latest}
    networks:
      default: null
    ports: []
    profiles:
      - "portal"
  token_validator:
    build:
      context: ./config/auth_validator
      dockerfile: Dockerfile
    depends_on:
      proxy:
        condition: service_started
        required: true
    environment:
      GITHUB_VALIDATION_CACHE_TTL: ${GITHUB_VALIDATION_CACHE_TTL:-60}
      NB_GATEWAY_GITHUB_ORG: ${NB_GATEWAY_GITHUB_ORG:-}
    image: neuropoly-db-token-validator:local
    networks:
      proxy-net: null
    profiles:
      - "portal"
volumes:
  graphdb_home:
    name: neuropoly_nb_dev_graphdb_home
  neurobagel_data:
    name: neuropoly_nb_dev_neurobagel_data
